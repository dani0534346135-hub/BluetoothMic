plugins { id 'com.android.application' }

android {
    namespace 'com.daniel.bluetoothmic'
    compileSdk 35

    defaultConfig {
        // New application id avoids conflicts with earlier APK signatures on Android 12.
        applicationId 'com.daniel.bluetoothmic.android12'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}
